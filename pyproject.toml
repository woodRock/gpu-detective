[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-detective"
version = "0.1.0"
description = "Who is using the GPU cluster, and how: history and reports on top of gpu-spooler"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["gpu-spooler"]

[project.scripts]
detective = "gpu_detective.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpu_detective*"]

[tool.setuptools.package-data]
gpu_detective = ["web/*.html"]

[tool.uv.sources]
# gpu-spooler's main is now Rust; its last Python version is tagged v0.1-python.
gpu-spooler = { git = "https://github.com/woodRock/gpu-spooler", tag = "v0.1-python" }
